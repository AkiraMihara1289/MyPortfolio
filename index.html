<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akira Mihara – Portfolio</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: #fff;
      color: #111;
      font-family: 'Helvetica Neue', 'Hiragino Sans', Arial, sans-serif;
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      padding: 22px 40px;
      display: flex;
      align-items: center;
      background: linear-gradient(to bottom, rgba(255,255,255,0.85) 0%, transparent 100%);
      pointer-events: none;
    }

    header h1 {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.4);
    }

    /* ── Each video section ── */
    .video-section {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .video-section video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      display: block;
    }

    /* ── YouTube section ── */
    .yt-section {
      width: 100%;
      min-height: 100vh;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 48px;
      gap: 40px;
    }

    .yt-section h2 {
      font-size: clamp(1.2rem, 2.5vw, 2rem);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.45);
    }

    .yt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    @media (max-width: 700px) {
      .yt-grid { grid-template-columns: 1fr; }
    }

    .yt-item {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .yt-item iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
    }

    /* ── Side navigation dots ── */
    #dot-nav {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 998;
    }

    .dnav {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0,0,0,0.18);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      border: none;
    }

    .dnav.active {
      background: #222;
      transform: scale(1.5);
    }

    /* ── Scroll progress bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: rgba(0,0,0,0.35);
      z-index: 1000;
      transition: width 0.1s;
    }
  </style>
</head>
<body>

<div id="topbar"></div>

<header>
  <h1>Akira Mihara &nbsp;/&nbsp; Portfolio</h1>
</header>

<div id="dot-nav"></div>

<main id="main"></main>

<script>
  const RAW = 'https://raw.githubusercontent.com/AkiraMihara1289/MyPortfolio/main/';

  const VIDEOS_BEFORE_YT = [
    '1.mp4','2.mp4','3.mp4','4.mp4','5.mp4','6.mp4',
    '7.mp4','8.mp4','8-1.mp4','9.mp4','10.mp4','11.mp4','12.mp4'
  ];
  const VIDEOS_AFTER_YT = ['13.mp4'];

  const YT_IDS = [
    'GNHDcUYDhSk',
    'oXhrMMxpMfw',
    'CLzW-r_4Ve4',
    'ZGJObgGDjmI'
  ];

  const main = document.getElementById('main');
  const dotNav = document.getElementById('dot-nav');
  const topbar = document.getElementById('topbar');

  const sections = [];
  const dots = [];

  function makeVideoSection(src) {
    const section = document.createElement('section');
    section.className = 'video-section';
    const video = document.createElement('video');
    video.src = RAW + src;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.preload = 'none';
    section.appendChild(video);
    return { el: section, type: 'video', video };
  }

  function makeYTSection() {
    const section = document.createElement('section');
    section.className = 'yt-section';
    const heading = document.createElement('h2');
    heading.textContent = 'YouTube Works';
    section.appendChild(heading);
    const grid = document.createElement('div');
    grid.className = 'yt-grid';
    YT_IDS.forEach(id => {
      const item = document.createElement('div');
      item.className = 'yt-item';
      const iframe = document.createElement('iframe');
      iframe.dataset.src = 'https://www.youtube.com/embed/' + id;
      iframe.allow = 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      iframe.allowFullscreen = true;
      item.appendChild(iframe);
      grid.appendChild(item);
    });
    section.appendChild(grid);
    return { el: section, type: 'youtube' };
  }

  function addSection(s) {
    main.appendChild(s.el);
    sections.push(s);
    const btn = document.createElement('button');
    btn.className = 'dnav';
    btn.addEventListener('click', () => s.el.scrollIntoView({ behavior: 'smooth' }));
    dotNav.appendChild(btn);
    dots.push(btn);
  }

  VIDEOS_BEFORE_YT.forEach(f => addSection(makeVideoSection(f)));
  addSection(makeYTSection());
  VIDEOS_AFTER_YT.forEach(f => addSection(makeVideoSection(f)));

  const videoObs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    });
  }, { threshold: 0.4 });

  const ytObs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.querySelectorAll('iframe[data-src]').forEach(iframe => {
        iframe.src = iframe.dataset.src;
        delete iframe.dataset.src;
      });
      ytObs.unobserve(entry.target);
    });
  }, { threshold: 0.1 });

  const dotObs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.findIndex(s => s.el === entry.target);
      if (idx === -1) return;
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    });
  }, { threshold: 0.5 });

  sections.forEach(s => {
    if (s.type === 'video') videoObs.observe(s.el);
    if (s.type === 'youtube') ytObs.observe(s.el);
    dotObs.observe(s.el);
  });

  window.addEventListener('scroll', () => {
    const total = document.body.scrollHeight - window.innerHeight;
    topbar.style.width = (total > 0 ? (window.scrollY / total) * 100 : 0) + '%';
  }, { passive: true });
</script>
</body>
</html>
